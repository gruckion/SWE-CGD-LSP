[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "swe-cgd-lsp"
version = "0.1.0"
description = "SWE-bench Code Generation with Diagnostics (CGD) - LSP-guided cleanup validation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "SWE-CGD Team"}
]

dependencies = [
    # SWE-bench harness (will be installed separately via git)
    # Core dependencies
    "datasets>=2.14.0",
    "huggingface-hub>=0.17.0",
    "docker>=6.1.0",
    "gitpython>=3.1.0",
    "unidiff>=0.7.0",

    # LLM interaction
    "litellm>=1.0.0",
    "anthropic>=0.18.0",
    "openai>=1.0.0",

    # Diagnostics
    "pyright>=1.1.350",

    # Utilities
    "rich>=13.0.0",
    "typer>=0.9.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "tenacity>=8.2.0",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
swe-cgd = "swe_cgd.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/swe_cgd"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
